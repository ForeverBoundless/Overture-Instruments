<link rel="icon" type="image/png" href="./ui/Logos/OvertureLogo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<body>

<div id="app-root"></div>

<main id="launcher-page" aria-label="Instrument library"></main>

<!--
  This is the only script tag the page needs: app.js is loaded as an ES
  module, and the browser resolves every `import` inside it (and inside
  everything IT imports) automatically by following the module graph.
  That's why this file doesn't also list Voice.js, AudioEngine.js, Knob.js,
  etc. individually - they're all pulled in transitively from js/app.js.

  Because this uses real ES modules (`type="module"`), opening this file
  directly from disk (a file:// URL) will be blocked by the browser's
  module-loading CORS policy. It must be served over http:// - see the
  project's README.md for the two-minute setup.
-->
<script type="module" src="js/app.js"></script>
<script type="module" src="js/launcher-components.js"></script>

</body>
</html>
