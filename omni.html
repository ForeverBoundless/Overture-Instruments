<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('overture-theme')==='light'?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.dataset.theme='dark';document.documentElement.style.colorScheme='dark';}})();</script>
<title>OMNI | Overture Instruments</title>
<meta name="description" content="OMNI lets you assemble a synthesizer from functional modules, connect real audio and control signals, play it, and save or export the design.">
<link rel="icon" href="/ui/Logos/OvertureLogo.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/keyboard.css"><link rel="stylesheet" href="/css/knobs.css"><link rel="stylesheet" href="/css/omni.css?v=20261104-boot-centering">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="stylesheet" href="/css/midi-map.css?v=20261104-omni-centered-modal">

<link rel="stylesheet" href="/css/site-theme.css">
<link rel="stylesheet" href="/css/site-theme-polish.css?v=20261103-accent-spacing">
<link rel="stylesheet" href="/css/omni-info.css?v=20261105-module-info">
<script src="/js/shared/site-theme.js" defer></script>
<script src="/js/shared/supabase-config.js"></script>
<script type="module" src="/js/shared/account-shell.js?v=20261102-contributions-menu"></script>
<script src="/js/shared/pwa.js" defer></script>
</head>
<body class="omni-page">
<main id="omni-root" aria-busy="true">
  <section class="omni-boot" id="omni-boot" role="status" aria-live="polite">
    <img src="/ui/Logos/OvertureLogo.png" alt="" width="48" height="48">
    <strong>OMNI</strong>
    <span class="omni-boot__message">Loading the synthesis engine…</span>
    <div class="omni-boot__meter">
      <span class="omni-boot__track" id="omni-boot-track" role="progressbar" aria-label="OMNI loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><i id="omni-boot-progress" style="width:4%"></i></span>
      <b id="omni-boot-value">4%</b>
    </div>
    <small id="omni-boot-detail">Preparing the module library and audio engine</small>
  </section>
</main>
<script>
  window.__overtureOmniBoot = {
    update(value, message, detail) {
      const progress = Math.max(0, Math.min(100, Math.round(value)));
      const root = document.getElementById('omni-root');
      const track = document.getElementById('omni-boot-track');
      const fill = document.getElementById('omni-boot-progress');
      const percent = document.getElementById('omni-boot-value');
      const label = document.querySelector('.omni-boot__message');
      const note = document.getElementById('omni-boot-detail');
      if (fill) fill.style.width = progress + '%';
      if (track) track.setAttribute('aria-valuenow', String(progress));
      if (percent) percent.textContent = progress + '%';
      if (label && message) label.textContent = message;
      if (note && detail) note.textContent = detail;
      if (root) root.setAttribute('aria-busy', 'true');
    },
    fail(message, detail) {
      const boot = document.getElementById('omni-boot');
      const label = document.querySelector('.omni-boot__message');
      const note = document.getElementById('omni-boot-detail');
      if (boot) boot.classList.add('is-error');
      if (label) label.textContent = message || 'OMNI could not start';
      if (note) note.textContent = detail || 'Reload the page to try again.';
    }
  };
</script>
<script type="module" src="/js/omni.js?v=20261105-module-info"></script>
<script type="module" src="/js/shared/midiMap.js"></script>
</body>
</html>
